  const [selectedProdModal, setSelectedProdModal] = useState(null);
  const [logoClicks, setLogoClicks] = useState(0);
  const [shipping, setShipping] = useState({
    name: 'Carlos Mendoza', email: 'cliente@tecnocalidad.cl',
    phone: '+56 9 1234 5678', address: 'Av. Providencia 1234, Apt 502', city: 'Santiago'
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('tc_theme', theme);
  }, [theme]);

  useEffect(() => {
    localStorage.setItem('tc_wishlist', JSON.stringify(wishlist));
  }, [wishlist]);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.has('admin')) {
      setShowLogin(true);
    }
    const handleKeyDown = (e) => {
      if (e.ctrlKey && e.altKey && (e.key === 'a' || e.key === 'A')) {
        setShowLogin(true);
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, []);

  const handleLogoClick = () => {
    setLogoClicks(prev => {
      const next = prev + 1;
      if (next >= 4) {
        setShowLogin(true);
        return 0;
      }
      return next;
    });
  };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const toggleWishlist = (product, e) => {
    e?.stopPropagation();
    if (wishlist.includes(product.id)) {
      setWishlist(prev => prev.filter(id => id !== product.id));
      showToast(`Removido de favoritos ❤️`);
    } else {
      setWishlist(prev => [...prev, product.id]);
      showToast(`¡Agregado a tus favoritos ❤️!`);
    }
  };

  const handleVariantSelect = (productId, variantName) => {
    setSelectedVariants(prev => ({ ...prev, [productId]: variantName }));
  };

  const addToCart = (p, e) => {
    e?.stopPropagation();
    const chosenVariant = selectedVariants[p.id] || (p.variants ? p.variants[0] : null);
    const itemKey = chosenVariant ? `${p.id}-${chosenVariant}` : p.id;
    const itemTitle = chosenVariant ? `${p.name} (${chosenVariant})` : p.name;

    setCart(prev => {
      const found = prev.find(i => i.itemKey === itemKey);
      if (found) return prev.map(i => i.itemKey === itemKey ? { ...i, quantity: i.quantity + 1 } : i);
      return [...prev, { ...p, itemKey, name: itemTitle, quantity: 1 }];
    });
    showToast(`"${itemTitle.slice(0, 30)}…" agregado al carrito`);
  };

  const handleLogin = (e) => {
    e.preventDefault();
    if (loginForm.username === 'admin' && loginForm.password === 'TecnoCalidad2026!') {
      sessionStorage.setItem('tc_token', 'demo_token');
      setAdminToken('demo_token');
      setShowLogin(false);
      setIsAdmin(true);
      showToast('¡Sesión admin iniciada!');
      return;
    }
    showToast('Credenciales incorrectas');
  };

  const handleCompleteOrder = (e) => {
    e.preventDefault();
    const rawSubtotal = cart.reduce((a, b) => a + b.price * b.quantity, 0);
    const shipping_fee = rawSubtotal * 1000 >= 50000 ? 0 : 3.990;
    const finalTotal = rawSubtotal + shipping_fee;

    const newOrd = {
      id: `TC-${Math.floor(100000 + Math.random() * 900000)}`,
      total: finalTotal,
      customer: shipping.name,
      method: payMethod === 'webpay' ? 'Webpay Plus (Transbank)' : payMethod === 'mercadopago' ? 'Mercado Pago Chile' : 'Stripe International'

    setCart([]);
    setCheckStep('confirmation');

    p.name.toLowerCase().includes(search.toLowerCase()) ||
    p.category.toLowerCase().includes(search.toLowerCase())
  ).slice(0, 4) : [];

    if (category === '❤️ Favoritos') return wishlist.includes(p.id);
    const catOk = category === 'Todos' || p.category === category;
    const srchOk = !search || p.name.toLowerCase().includes(search.toLowerCase()) || (p.description || '').toLowerCase().includes(search.toLowerCase());
    return catOk && srchOk;
  });

  const rawSub = cart.reduce((a, b) => a + b.price * b.quantity, 0);

          </div>
        </button>

        {!isAdmin && (

            <input
              type="search"
              placeholder="Buscar cargadores GaN, repuestos, adaptadores, lámparas..."
              value={search}
              onFocus={() => setSearchFocused(true)}
              onBlur={() => setTimeout(() => setSearchFocused(false), 200)}
              onChange={e => setSearch(e.target.value)}
              className="field w-full"
            />
            {searchFocused && searchSuggestions.length > 0 && (

                <div className="text-[10px] font-bold text-cyan-400 px-3 py-1 uppercase">Sugerencias Predictivas</div>
                {searchSuggestions.map(s => (
                  <div
                    key={s.id}
                    onClick={() => { setSelectedProdModal(s); setSearch(''); }}
                    className="flex items-center gap-3 p-2 hover:bg-slate-800 rounded-lg cursor-pointer transition-all"
                  >
                    <img src={s.image} className="w-10 h-10 rounded-md object-cover" alt="" />
                    <div className="flex-1 text-xs">
                      <div className="font-bold text-white line-clamp-1">{s.name}</div>
                      <div className="text-[11px] text-cyan-400 font-bold">{fmtCLP(s.price)}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        <div className="flex items-center gap-2.5">
          {isAdmin && (
            <button onClick={() => setIsAdmin(false)} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-400">
              🛍️ Ver Tienda
            </button>
          )}

          <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="w-8 h-8 rounded-full bg-slate-800 text-sm flex items-center justify-center">
            {theme === 'dark' ? '☀️' : '🌙'}
          </button>

          {!isAdmin && (
            <button onClick={() => setCartOpen(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-cyan-500/15 border border-cyan-500/35 text-white font-bold text-xs">

              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {filtered.map(p => {
                  const isFav = wishlist.includes(p.id);
                  const selectedVariant = selectedVariants[p.id] || (p.variants ? p.variants[0] : null);

                  return (
                    <div
                      key={p.id}
                      onClick={() => setSelectedProdModal(p)}
                      className="card glass p-4 rounded-2xl flex flex-col justify-between cursor-pointer relative"
                    >
                      <button
                        onClick={(e) => toggleWishlist(p, e)}
                        className="absolute top-6 right-6 z-10 w-8 h-8 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-sm border border-slate-700 hover:scale-110 transition-transform"
                      >
                        {isFav ? '❤️' : '🤍'}
                      </button>

                      <div>
                        <div className="relative aspect-square rounded-xl overflow-hidden bg-slate-950 mb-3">
                          <img src={p.image} alt={p.name} className="w-full h-full object-cover" />
                          {p.badge && <span className="absolute top-2 left-2 badge">{p.badge}</span>}
                        </div>
                        <div className="text-[10px] font-bold text-cyan-400 uppercase mb-1">{p.category}</div>
                        <h3 className="text-sm font-bold text-white line-clamp-2 mb-1">{p.name}</h3>
                        
                        <div className="flex items-center gap-1.5 text-xs text-amber-400 font-bold mb-2">
                          <span>⭐ {p.rating}</span>
                          <span className="text-slate-400 text-[10px]">({p.reviewsCount} opiniones)</span>
                        </div>

                        {p.variants && (
                          <div className="mb-3" onClick={e => e.stopPropagation()}>
                            <label className="text-[10px] font-bold text-slate-400 block mb-1">Opción / Variante:</label>
                            <select
                              value={selectedVariant}
                              onChange={e => handleVariantSelect(p.id, e.target.value)}
                              className="field py-1 text-[11px]"
                            >
                              {p.variants.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                          </div>
                        )}

                        <div className="text-[11px] font-semibold text-emerald-400 mb-2">
                          {p.stock < 35 ? `🔥 ¡Últimas ${p.stock} unidades!` : `✓ Stock disponible (${p.stock} u.)`}
                        </div>
                      </div>

                      <div className="pt-3 mt-1 border-t border-slate-800 flex items-center justify-between">
                        <div>
                          <div className="font-black text-white">{fmtCLP(p.price)}</div>
                          {p.oldPrice && <div className="text-[10px] text-slate-500 line-through">{fmtCLP(p.oldPrice)}</div>}
                        </div>
                        <button onClick={(e) => addToCart(p, e)} className="grad-btn px-3 py-1.5 text-xs rounded-xl">
                          + Agregar
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        </main>
      ) : (
        /* ADMIN DASHBOARD */
        <main className="flex-1 max-w-6xl w-full mx-auto p-6">
          <div className="flex justify-between items-center mb-4">
            <h1 className="text-2xl font-black text-white">Panel TecnoCalidad</h1>
            <button onClick={() => { setIsAdmin(false); sessionStorage.removeItem('tc_token'); setAdminToken(null); }} className="text-xs text-rose-400 font-bold hover:underline">Cerrar Sesión Admin</button>
          </div>
          <div className="glass p-6 rounded-2xl space-y-4">
            <h3 className="text-sm font-bold text-white">Productos en Catálogo ({products.length})</h3>
            <div className="space-y-2 text-xs">
              {products.map(p => (
                <div key={p.id} className="p-3 bg-slate-950 rounded-xl flex justify-between items-center">
                  <span>{p.name} ({p.category})</span>
                  <span className="font-bold text-cyan-400">{fmtCLP(p.price)}</span>
                </div>
              ))}
            </div>
          </div>
        </main>
      )}

      {/* FOOTER */}
      <footer className="mt-auto border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <span onClick={() => setShowLogin(true)} className="cursor-pointer hover:text-slate-400">
          © {new Date().getFullYear()} TecnoCalidad · Proveedores AliExpress Direct
        </span>
      </footer>

      {/* MODAL DETALLE DE PRODUCTO */}
      {selectedProdModal && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-lg bg-slate-900 p-6 rounded-2xl relative max-h-[90vh] overflow-y-auto">
            <button onClick={() => setSelectedProdModal(null)} className="absolute top-4 right-4 text-slate-400 text-lg">✕</button>
            <div className="flex flex-col sm:flex-row gap-5">
              <img src={selectedProdModal.image} className="w-full sm:w-48 aspect-square rounded-xl object-cover" alt="" />
              <div className="space-y-2 text-xs flex-1">
                <span className="badge">{selectedProdModal.category}</span>
                <h3 className="text-base font-bold text-white">{selectedProdModal.name}</h3>
                <div className="text-amber-400 font-bold">⭐ {selectedProdModal.rating} ({selectedProdModal.reviewsCount} evaluaciones)</div>
                <p className="text-slate-300">{selectedProdModal.description}</p>
                <div className="font-black text-cyan-400 text-lg">{fmtCLP(selectedProdModal.price)}</div>
                
                {selectedProdModal.variants && (
                  <div>
                    <label className="font-bold text-slate-300 block mb-1">Seleccionar Variante:</label>
                    <select
                      value={selectedVariants[selectedProdModal.id] || selectedProdModal.variants[0]}
                      onChange={e => handleVariantSelect(selectedProdModal.id, e.target.value)}
                      className="field"
                    >
                      {selectedProdModal.variants.map(v => <option key={v} value={v}>{v}</option>)}
                    </select>
                  </div>
                )}

                <button
                  onClick={() => { addToCart(selectedProdModal); setSelectedProdModal(null); }}
                  className="w-full grad-btn py-2.5 text-xs mt-3"
                >
                  + Agregar al Carrito
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* CART DRAWER */}
      {cartOpen && (
        <div className="fixed inset-0 z-50 bg-black/70 flex justify-end">
          <div className="w-full max-w-md bg-slate-900 p-6 flex flex-col h-full border-l border-slate-800">
            <div className="flex justify-between items-center pb-4 border-b border-slate-800">
              <h2 className="font-bold text-white">Carrito TecnoCalidad ({cartCount})</h2>
              <button onClick={() => setCartOpen(false)} className="text-slate-400 text-lg">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto py-4 space-y-3">
              {cart.map(item => (
                <div key={item.itemKey || item.id} className="bg-slate-950 p-3 rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <div className="font-bold text-white">{item.name}</div>
                    <div className="text-cyan-400 font-bold">{fmtCLP(item.price)} x {item.quantity}</div>
                  </div>
                </div>
              ))}
            </div>
            {cart.length > 0 && (
              <div className="pt-4 border-t border-slate-800">
                <div className="flex justify-between font-bold text-white mb-4 text-sm">
                  <span>Total:</span>
                  <span className="grad-text">{fmtCLP(totPay)}</span>
                </div>
                <button onClick={() => { setCartOpen(false); setCheckoutOpen(true); }} className="w-full grad-btn py-3 text-xs">
                  Ir al Checkout →
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* CHECKOUT MODAL */}
      {checkoutOpen && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-md bg-slate-900 p-6 rounded-2xl relative">
            {checkoutStep !== 'confirmation' && (
              <button onClick={() => setCheckoutOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            )}
            {checkoutStep === 'shipping' && (
              <form onSubmit={() => setCheckStep('payment')} className="space-y-3 text-xs">
                <h3 className="font-bold text-cyan-400 uppercase">1. Datos de Envío</h3>
                <input type="text" required value={shipping.name} onChange={e => setShipping({...shipping, name: e.target.value})} className="field" placeholder="Nombre completo" />
                <input type="email" required value={shipping.email} onChange={e => setShipping({...shipping, email: e.target.value})} className="field" placeholder="Correo electrónico" />
                <input type="text" required value={shipping.address} onChange={e => setShipping({...shipping, address: e.target.value})} className="field" placeholder="Dirección completa" />
                <button type="submit" className="w-full grad-btn py-3 mt-2">Continuar a Pago</button>
              </form>
            )}

            {checkoutStep === 'payment' && (
              <form onSubmit={handleCompleteOrder} className="space-y-3 text-xs">
                <h3 className="font-bold text-cyan-400 uppercase">2. Medio de Pago</h3>
                <div className="space-y-2">
                  <label onClick={() => setPayMethod('webpay')} className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === 'webpay' ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                    💳 Transbank Webpay Plus (Débito/Crédito Chile)
                  </label>
                  <label onClick={() => setPayMethod('mercadopago')} className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === 'mercadopago' ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                    📱 Mercado Pago Chile (Dinero en Cuenta / Tarjetas)
                  </label>
                  <label onClick={() => setPayMethod('stripe')} className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === 'stripe' ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                    🔒 Stripe International (Visa / Mastercard)
                  </label>
                </div>
                <button type="submit" className="w-full grad-btn py-3 mt-2">Simular Pago & Confirmar {fmtCLP(totPay)}</button>
              </form>
            )}

            {checkoutStep === 'confirmation' && createdOrder && (
              <div className="text-center py-6 space-y-3 text-xs">
                <div className="text-3xl text-emerald-400">✓</div>
                <h3 className="text-lg font-black text-white">¡Orden Confirmada!</h3>
                <p className="text-slate-400">Orden {createdOrder.id} procesada con {createdOrder.method}.</p>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-left font-semibold">
                  <div>Cliente: {createdOrder.customer}</div>
                  <div className="text-cyan-400 font-bold mt-1">Total: {fmtCLP(createdOrder.total)}</div>
                </div>
                <button onClick={() => { setCheckoutOpen(false); setCheckStep('shipping'); }} className="grad-btn px-6 py-2">
                  Volver a la Tienda
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* LOGIN ADMIN MODAL */}
      {showLoginModal && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-sm bg-slate-900 p-6 rounded-2xl relative">
            <button onClick={() => setShowLogin(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 className="text-sm font-bold text-white mb-3 text-center">Acceso Administrador TecnoCalidad</h3>
            <form onSubmit={handleLogin} className="space-y-3 text-xs">
              <input type="text" placeholder="Usuario" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="field" />
              <input type="password" placeholder="Contraseña" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="field" />
              <button type="submit" className="w-full grad-btn py-2.5">Iniciar Sesión</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
