              <div className="font-bold text-white">
                🛒 {socialProof.name} de {socialProof.city}
              </div>
              <div className="text-slate-300">
                compró {socialProof.qty}x {socialProof.product}
              </div>
              <div className="text-[10px] text-slate-500">hace {socialProof.mins} min</div>
            </div>
          </div>
        </div>
      )}

      {/* ═══ WHATSAPP FLOATING BUTTON ═══ */}
      {!socialProof && !isAdmin && (
        <a href="https://wa.me/56912345678?text=Hola%2C%20vi%20un%20producto%20en%20TecnoCalidad%20y%20tengo%20una%20consulta" target="_blank" rel="noopener noreferrer" className="wa-btn" title="¿Dudas? Escríbenos por WhatsApp">
          💬
        </a>
      )}

      {/* HEADER */}
      <header className="glass-nav sticky top-0 z-40 px-5 py-4 flex items-center justify-between">
        <button onClick={handleLogoClick} className="flex items-center gap-2.5 text-left">
          <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center text-black font-black text-lg">⚡</div>
          <div>
            <div className="text-lg font-extrabold text-white leading-none">TECNO <span className="grad-text">CALIDAD</span></div>
            <div className="text-[9px] font-bold text-cyan-400 tracking-widest uppercase">Tecnología directa de fábrica</div>
          </div>
        </button>

        {!isAdmin && (
          <div className="hidden md:block flex-1 max-w-md mx-6 relative">
            <input type="search" placeholder="¿Qué estás buscando hoy?" value={search}
              onFocus={() => setSearchFocused(true)}
              onBlur={() => setTimeout(() => setSearchFocused(false), 200)}
              onChange={e => setSearch(e.target.value)}
              className="field w-full"
            />
            {searchFocused && searchSuggestions.length > 0 && (
              <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl p-2 shadow-2xl z-50">
                {searchSuggestions.map(s => (
                  <div key={s.id} onClick={() => { setSelectedProdModal(s); setSearch(''); }}
                    className="flex items-center gap-3 p-2 hover:bg-slate-800 rounded-lg cursor-pointer transition-all">
                    <img src={s.image} className="w-10 h-10 rounded-md object-cover" alt="" />
                    <div className="flex-1 text-xs">
                      <div className="font-bold text-white line-clamp-1">{s.name.split('—')[0]}</div>
                      <div className="text-[11px] text-cyan-400 font-bold">{fmtCLP(s.price)}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        <div className="flex items-center gap-2.5">
          {isAdmin && (
            <button onClick={() => setIsAdmin(false)} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-400">🛍️ Tienda</button>
          )}
          <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')} className="w-8 h-8 rounded-full bg-slate-800 text-sm flex items-center justify-center">
            {theme === 'dark' ? '☀️' : '🌙'}
          </button>
          {!isAdmin && (
            <button onClick={() => setCartOpen(true)} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-cyan-500/15 border border-cyan-500/35 text-white font-bold text-xs">
              🛒 ({cartCount})
            </button>
          )}
        </div>
      </header>

      {!isAdmin ? (
        <main className="flex-1">
          {/* HERO + COUNTDOWN */}
          <section className="border-b border-slate-800/60 pt-6 pb-8">
            <div className="max-w-6xl mx-auto px-5">
              <div className="glass p-8 sm:p-10 rounded-3xl bg-gradient-to-r from-slate-900 via-slate-900 to-slate-950">
                <div className="max-w-xl">
                  <span className="badge badge-hot inline-block mb-3">🔥 Hot Sale — Oferta termina en <span className="countdown">{pad(countdown.h)}h : {pad(countdown.m)}m : {pad(countdown.s)}s</span></span>
                  <h1 className="text-3xl sm:text-4xl font-black text-white leading-tight mb-3">
                    Tecnología que <span className="grad-text">resuelve tu día</span>
                  </h1>
                  <p className="text-slate-300 text-xs sm:text-sm mb-4">
                    Carga más rápido. Conecta todo. Ilumina sin cables. Directo de fábrica a tu puerta.
                  </p>

                  {/* ═══ TRUST BADGES ═══ */}
                  <div className="trust-bar">
                    <div className="trust-badge">🛡️ Garantía 12 meses</div>
                    <div className="trust-badge">🚚 Envío gratis sobre $50.000</div>
                    <div className="trust-badge">🔄 30 días de devolución</div>
                  </div>
                </div>
              </div>

              {/* CATEGORIES */}
              <div className="flex gap-2 overflow-x-auto py-5 no-scrollbar">
                {CATEGORIES.map(cat => (
                  <button key={cat} onClick={() => setCategory(cat)}
                    className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border transition-all ${
                      category === cat
                        ? 'bg-gradient-to-r from-cyan-400 to-blue-500 text-black border-cyan-300 shadow-md'
                        : cat === '🔥 Hot Sale'
                        ? 'bg-rose-500/20 text-rose-400 border-rose-500/40 hover:bg-rose-500/30'
                        : 'bg-slate-900 text-slate-300 border-slate-800 hover:border-slate-600'
                    }`}>
                    {cat}
                  </button>
                ))}
              </div>
            </div>
          </section>

          {/* PRODUCT GRID */}
          <section className="max-w-6xl mx-auto px-5 py-8">
            {filtered.length === 0 ? (
              <div className="glass p-12 rounded-2xl text-center text-slate-400">
                <div className="text-4xl mb-3">🔍</div>
                <p className="font-bold text-white text-base">No se encontraron resultados</p>
                <button onClick={() => { setCategory('Todos'); setSearch(''); }} className="mt-3 text-xs text-cyan-400 underline">Ver todos</button>
              </div>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {filtered.map(p => {
                  const selectedVariant = selectedVariants[p.id] || (p.variants ? p.variants[0] : null);
                  return (
                    <div key={p.id} onClick={() => setSelectedProdModal(p)}
                      className="card glass p-4 rounded-2xl flex flex-col justify-between cursor-pointer relative">
                      <div>
                        <div className="relative aspect-square rounded-xl overflow-hidden bg-slate-950 mb-3">
                          <img src={p.image} alt={p.name} className="w-full h-full object-cover" />
                          {p.badge && <span className={`absolute top-2 left-2 badge ${p.badge.includes('HOT') ? 'badge-hot' : ''}`}>{p.badge}</span>}
                        </div>
                        <div className="text-[10px] font-bold text-cyan-400 uppercase mb-1">{p.category}</div>
                        <h3 className="text-sm font-bold text-white line-clamp-2 mb-1">{p.name}</h3>
                        
                        {/* HEADLINE EMOCIONAL */}
                        {p.headline && (
                          <p className="text-[11px] text-slate-300 italic mb-2 line-clamp-2">"{p.headline}"</p>
                        )}

                        <div className="flex items-center gap-1.5 text-xs text-amber-400 font-bold mb-2">
                          <span>⭐ {p.rating}</span>
                          <span className="text-slate-400 text-[10px]">({p.reviewsCount} opiniones)</span>
                        </div>

                        {p.variants && (
                          <div className="mb-3" onClick={e => e.stopPropagation()}>
                            <select value={selectedVariant} onChange={e => handleVariantSelect(p.id, e.target.value)}
                              className="field py-1 text-[11px]">
                              {p.variants.map(v => <option key={v} value={v}>{v}</option>)}
                            </select>
                          </div>
                        )}

                        <div className="text-[11px] font-semibold text-emerald-400 mb-2">
                          {p.stock < 35 ? `🔥 ¡Últimas ${p.stock} unidades!` : `✓ Stock disponible`}
                        </div>
                      </div>

                      <div className="pt-3 mt-1 border-t border-slate-800">
                        <div className="flex items-center justify-between mb-2">
                          <div>
                            <div className="font-black text-white">{fmtCLP(p.price)}</div>
                            {p.oldPrice && <div className="text-[10px] text-slate-500 line-through">{fmtCLP(p.oldPrice)}</div>}
                          </div>
                          <button onClick={(e) => addToCart(p, e)} className="grad-btn px-3 py-1.5 text-xs rounded-xl">+ Agregar</button>
                        </div>
                        {/* MINI TRUST BADGES PER CARD */}
                        <div className="flex gap-1 text-[9px] text-slate-500">
                          <span>🛡️ Garantía</span>
                          <span>·</span>
                          <span>🚚 Envío rápido</span>
                          <span>·</span>
                          <span>🔄 Devolución</span>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </section>
        </main>
      ) : (
        <main className="flex-1 max-w-6xl w-full mx-auto p-6">
          <div className="flex justify-between items-center mb-4">
            <h1 className="text-2xl font-black text-white">Panel TecnoCalidad</h1>
            <button onClick={() => { setIsAdmin(false); sessionStorage.removeItem('tc_token'); }} className="text-xs text-rose-400 font-bold hover:underline">Cerrar Sesión</button>
          </div>
          <div className="glass p-6 rounded-2xl space-y-4">
            <h3 className="text-sm font-bold text-white">Catálogo ({products.length})</h3>
            <div className="space-y-2 text-xs">
              {products.map(p => (
                <div key={p.id} className="p-3 bg-slate-950 rounded-xl flex justify-between items-center">
                  <span>{p.name.split('—')[0]}</span>
                  <span className="font-bold text-cyan-400">{fmtCLP(p.price)}</span>
                </div>
              ))}
            </div>
          </div>
        </main>
      )}

      <footer className="mt-auto border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <span onClick={() => setShowLogin(true)} className="cursor-pointer hover:text-slate-400">
          © {new Date().getFullYear()} TecnoCalidad · Tecnología directa de fábrica
        </span>
      </footer>

      {/* PRODUCT DETAIL MODAL */}
      {selectedProdModal && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-lg bg-slate-900 p-6 rounded-2xl relative max-h-[90vh] overflow-y-auto">
            <button onClick={() => setSelectedProdModal(null)} className="absolute top-4 right-4 text-slate-400 text-lg">✕</button>
            <div className="flex flex-col sm:flex-row gap-5">
              <img src={selectedProdModal.image} className="w-full sm:w-48 aspect-square rounded-xl object-cover" alt="" />
              <div className="space-y-2 text-xs flex-1">
                <span className="badge">{selectedProdModal.category}</span>
                <h3 className="text-base font-bold text-white">{selectedProdModal.name}</h3>
                <div className="text-amber-400 font-bold">⭐ {selectedProdModal.rating} ({selectedProdModal.reviewsCount} evaluaciones)</div>
                
                {selectedProdModal.headline && (
                  <p className="text-sm text-cyan-300 font-semibold italic">"{selectedProdModal.headline}"</p>
                )}
                <p className="text-slate-300">{selectedProdModal.description}</p>

                <div className="font-black text-cyan-400 text-lg">{fmtCLP(selectedProdModal.price)}
                  {selectedProdModal.oldPrice && <span className="text-sm text-slate-500 line-through ml-2">{fmtCLP(selectedProdModal.oldPrice)}</span>}
                </div>
                
                {selectedProdModal.variants && (
                  <div>
                    <label className="font-bold text-slate-300 block mb-1">Elige tu opción:</label>
                    <select value={selectedVariants[selectedProdModal.id] || selectedProdModal.variants[0]}
                      onChange={e => handleVariantSelect(selectedProdModal.id, e.target.value)} className="field">
                      {selectedProdModal.variants.map(v => <option key={v} value={v}>{v}</option>)}
                    </select>
                  </div>
                )}

                <button onClick={() => { addToCart(selectedProdModal); setSelectedProdModal(null); }}
                  className="w-full grad-btn py-2.5 text-xs mt-3">+ Agregar al Carrito</button>
                
                <div className="trust-bar mt-2">
                  <div className="trust-badge">🛡️ Garantía 12 meses</div>
                  <div className="trust-badge">🚚 Envío gratis +$50k</div>
                  <div className="trust-badge">🔄 30 días devolución</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* CART DRAWER */}
      {cartOpen && (
        <div className="fixed inset-0 z-50 bg-black/70 flex justify-end">
          <div className="w-full max-w-md bg-slate-900 p-6 flex flex-col h-full border-l border-slate-800">
            <div className="flex justify-between items-center pb-4 border-b border-slate-800">
              <h2 className="font-bold text-white">Tu Carrito ({cartCount})</h2>
              <button onClick={() => setCartOpen(false)} className="text-slate-400 text-lg">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto py-4 space-y-3">
              {cart.map(item => (
                <div key={item.itemKey || item.id} className="bg-slate-950 p-3 rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <div className="font-bold text-white">{item.name}</div>
                    <div className="text-cyan-400 font-bold">{fmtCLP(item.price)} x {item.quantity}</div>
                  </div>
                </div>
              ))}
            </div>
            {cart.length > 0 && (
              <div className="pt-4 border-t border-slate-800">
                {rawSub * 1000 < 50000 && (
                  <div className="text-[10px] text-amber-400 mb-2 font-semibold">
                    💡 Agrega {fmtCLP((50 - rawSub))} más para obtener envío gratis
                  </div>
                )}
                <div className="flex justify-between font-bold text-white mb-4 text-sm">
                  <span>Total:</span>
                  <span className="grad-text">{fmtCLP(totPay)}</span>
                </div>
                <button onClick={() => { setCartOpen(false); setCheckoutOpen(true); }} className="w-full grad-btn py-3 text-xs">
                  Ir al Checkout →
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* CHECKOUT MODAL */}
      {checkoutOpen && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-md bg-slate-900 p-6 rounded-2xl relative">
            {checkoutStep !== 'confirmation' && (
              <button onClick={() => setCheckoutOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            )}
            {checkoutStep === 'shipping' && (
              <form onSubmit={() => setCheckStep('payment')} className="space-y-3 text-xs">
                <h3 className="font-bold text-cyan-400 uppercase">1. ¿A dónde te lo enviamos?</h3>
                <input type="text" required value={shipping.name} onChange={e => setShipping({...shipping, name: e.target.value})} className="field" placeholder="Tu nombre completo" />
                <input type="email" required value={shipping.email} onChange={e => setShipping({...shipping, email: e.target.value})} className="field" placeholder="Tu correo electrónico" />
                <input type="text" required value={shipping.address} onChange={e => setShipping({...shipping, address: e.target.value})} className="field" placeholder="Dirección completa (calle, número, depto)" />
                <button type="submit" className="w-full grad-btn py-3 mt-2">Continuar al Pago →</button>
                <div className="trust-bar justify-center">
                  <div className="trust-badge">🔒 Datos protegidos</div>
                  <div className="trust-badge">🚚 Envío seguro</div>
                </div>
              </form>
            )}

            {checkoutStep === 'payment' && (
              <form onSubmit={handleCompleteOrder} className="space-y-3 text-xs">
                <h3 className="font-bold text-cyan-400 uppercase">2. ¿Cómo prefieres pagar?</h3>
                <div className="space-y-2">
                  {[
                    { id: 'webpay', label: '💳 Webpay Plus — Tarjeta Débito/Crédito' },
                    { id: 'mercadopago', label: '📱 Mercado Pago — Cuenta o Tarjetas' },
                    { id: 'stripe', label: '🔒 Stripe — Visa / Mastercard Internacional' }
                  ].map(pm => (
                    <label key={pm.id} onClick={() => setPayMethod(pm.id)}
                      className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === pm.id ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                      {pm.label}
                    </label>
                  ))}
                </div>
                <button type="submit" className="w-full grad-btn py-3 mt-2">Confirmar Compra {fmtCLP(totPay)}</button>
              </form>
            )}

            {checkoutStep === 'confirmation' && createdOrder && (
              <div className="text-center py-6 space-y-3 text-xs">
                <div className="text-3xl text-emerald-400">✓</div>
                <h3 className="text-lg font-black text-white">¡Compra Confirmada!</h3>
                <p className="text-slate-400">Orden {createdOrder.id} · {createdOrder.method}</p>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-left font-semibold">
                  <div>Cliente: {createdOrder.customer}</div>
                  <div className="text-cyan-400 font-bold mt-1">Total: {fmtCLP(createdOrder.total)}</div>
                </div>
                <button onClick={() => { setCheckoutOpen(false); setCheckStep('shipping'); }} className="grad-btn px-6 py-2">
                  Volver a la Tienda
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* LOGIN ADMIN MODAL */}
      {showLoginModal && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-sm bg-slate-900 p-6 rounded-2xl relative">
            <button onClick={() => setShowLogin(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 className="text-sm font-bold text-white mb-3 text-center">Acceso Administrador</h3>
            <form onSubmit={handleLogin} className="space-y-3 text-xs">
              <input type="text" placeholder="Usuario" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="field" />
              <input type="password" placeholder="Contraseña" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="field" />
              <button type="submit" className="w-full grad-btn py-2.5">Entrar</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
