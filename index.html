              {products.map(p => (
                <div key={p.id} className="p-3 bg-slate-950 rounded-xl flex justify-between items-center">
                  <span>{p.name} ({p.category})</span>
                  <span className="font-bold text-cyan-400">{fmtCLP(p.price)}</span>
                </div>
              ))}
            </div>
          </div>
        </main>
      )}

      {/* FOOTER */}
      <footer className="mt-auto border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        © {new Date().getFullYear()} TecnoCalidad · Opciones de Pago Visuales Webpay Plus / Mercado Pago / Stripe
      </footer>

      {/* CART DRAWER */}
      {cartOpen && (
        <div className="fixed inset-0 z-50 bg-black/70 flex justify-end">
          <div className="w-full max-w-md bg-slate-900 p-6 flex flex-col h-full border-l border-slate-800">
            <div className="flex justify-between items-center pb-4 border-b border-slate-800">
              <h2 className="font-bold text-white">Carrito TecnoCalidad ({cartCount})</h2>
              <button onClick={() => setCartOpen(false)} className="text-slate-400 text-lg">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto py-4 space-y-3">
              {cart.map(item => (
                <div key={item.id} className="bg-slate-950 p-3 rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <div className="font-bold text-white">{item.name}</div>
                    <div className="text-cyan-400 font-bold">{fmtCLP(item.price)} x {item.quantity}</div>
                  </div>
                </div>
              ))}
            </div>
            {cart.length > 0 && (
              <div className="pt-4 border-t border-slate-800">
                <div className="flex justify-between font-bold text-white mb-4 text-sm">
                  <span>Total:</span>
                  <span className="grad-text">{fmtCLP(totPay)}</span>
                </div>
                <button onClick={() => { setCartOpen(false); setCheckoutOpen(true); }} className="w-full grad-btn py-3 text-xs">
                  Ir al Checkout →
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* CHECKOUT MODAL (VISUAL COMPOSITION - NO EXTERNAL REDIRECTS) */}
      {checkoutOpen && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-md bg-slate-900 p-6 rounded-2xl relative">
            {checkoutStep !== 'confirmation' && (
              <button onClick={() => setCheckoutOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            )}
            {checkoutStep === 'shipping' && (
              <form onSubmit={() => setCheckStep('payment')} className="space-y-3 text-xs">
                <h3 className="font-bold text-cyan-400 uppercase">1. Datos de Envío</h3>
                <input type="text" required value={shipping.name} onChange={e => setShipping({...shipping, name: e.target.value})} className="field" placeholder="Nombre completo" />
                <input type="email" required value={shipping.email} onChange={e => setShipping({...shipping, email: e.target.value})} className="field" placeholder="Correo electrónico" />
                <input type="text" required value={shipping.address} onChange={e => setShipping({...shipping, address: e.target.value})} className="field" placeholder="Dirección completa" />
                <button type="submit" className="w-full grad-btn py-3 mt-2">Continuar a Pago</button>
              </form>
            )}

            {checkoutStep === 'payment' && (
              <form onSubmit={handleCompleteOrder} className="space-y-3 text-xs">
                <h3 className="font-bold text-cyan-400 uppercase">2. Selección de Medio de Pago</h3>
                <div className="space-y-2">
                  <label onClick={() => setPayMethod('webpay')} className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === 'webpay' ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                    💳 Transbank Webpay Plus (Débito/Crédito Chile)
                  </label>
                  <label onClick={() => setPayMethod('mercadopago')} className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === 'mercadopago' ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                    📱 Mercado Pago Chile (Dinero en Cuenta / Tarjetas)
                  </label>
                  <label onClick={() => setPayMethod('stripe')} className={`block p-3 rounded-xl border cursor-pointer transition-all ${payMethod === 'stripe' ? 'border-cyan-400 bg-cyan-500/10 font-bold text-white' : 'border-slate-800 bg-slate-950 text-slate-300'}`}>
                    🔒 Stripe International (Visa / Mastercard)
                  </label>
                </div>
                <button type="submit" className="w-full grad-btn py-3 mt-2">Simular Pago & Confirmar {fmtCLP(totPay)}</button>
              </form>
            )}

            {checkoutStep === 'confirmation' && createdOrder && (
              <div className="text-center py-6 space-y-3 text-xs">
                <div className="text-3xl text-emerald-400">✓</div>
                <h3 className="text-lg font-black text-white">¡Orden Demo Confirmada!</h3>
                <p className="text-slate-400">Orden {createdOrder.id} procesada con {createdOrder.method}.</p>
                <div className="p-3 bg-slate-950 rounded-xl border border-slate-800 text-left font-semibold">
                  <div>Cliente: {createdOrder.customer}</div>
                  <div className="text-cyan-400 font-bold mt-1">Total: {fmtCLP(createdOrder.total)}</div>
                </div>
                <button onClick={() => { setCheckoutOpen(false); setCheckStep('shipping'); }} className="grad-btn px-6 py-2">
                  Volver a la Tienda
                </button>
              </div>
            )}
          </div>
        </div>
      )}

      {/* LOGIN ADMIN MODAL */}
      {showLoginModal && (
        <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
          <div className="glass w-full max-w-sm bg-slate-900 p-6 rounded-2xl relative">
            <button onClick={() => setShowLogin(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 className="text-sm font-bold text-white mb-3 text-center">Acceso Administrador TecnoCalidad</h3>
            <form onSubmit={handleLogin} className="space-y-3 text-xs">
              <input type="text" placeholder="Usuario" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="field" />
              <input type="password" placeholder="Contraseña" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="field" />
              <button type="submit" className="w-full grad-btn py-2.5">Iniciar Sesión</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
